<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: 'wasm-unsafe-eval' blob:; worker-src blob:; style-src 'self' file: 'unsafe-inline'; img-src data: blob:; connect-src blob: data:; font-src data:">
<title>Organizador da Maioral</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Organizador Maioral</h1>
  <span class="lock" title="Este arquivo funciona sem internet. Os PDFs são lidos apenas na memória do navegador e nada é enviado para nenhum servidor."></span>
  <div class="grow"></div>
  <input type="text" id="nome" placeholder="Nome completo do candidato">
  <label class="chk"><input type="checkbox" id="capa"> Capa com checklist</label>
  <button id="btnAdd">+ Adicionar arquivos</button>
  <button id="btnClear">Limpar</button>
  <button id="btnLock">Bloquear</button>
  <button id="btnPrint" disabled>Abrir para imprimir</button>
  <button id="btnSave" class="primary" disabled>Baixar PDF organizado</button>
  <input type="file" id="file" multiple accept="application/pdf,image/*" hidden>
</header>
<div class="layout">
  <aside>
    <div class="summary" id="summary">Nenhum arquivo carregado.</div>
    <h2>Clique para classificar a(s) página(s) selecionada(s)</h2>
    <div id="cats"></div>
  </aside>
  <main>
    <div class="toolbar">
      <div class="tabs"><button data-v="classify" class="on">1 · Classificar páginas</button><button data-v="final">2 · Ordem de impressão</button></div>
      <span class="hint">Selecione e digite o nº: <kbd>4</kbd> RG · <kbd>1</kbd><kbd>0</kbd> CTPS · <kbd>X</kbd> descartar · <kbd>R</kbd> girar · <kbd>Enter</kbd> ampliar · <kbd>←</kbd><kbd>→</kbd> navegar</span>
      <span id="progress"></span>
    </div>
    <div id="scroller"><div id="grid"></div></div>
  </main>
</div>
<div id="modal"><div class="bar"><button id="mPrev">←</button><span id="mInfo"></span><button id="mNext">→</button><button id="mRot">Girar (R)</button><button id="mClose">Fechar (Esc)</button></div><div id="mBody"></div></div>
<div id="toast"></div>
<div id="lock"><form id="lockForm" autocomplete="off">
  <h2>Organizador da Maioral</h2>
  <p>Digite a senha flopade</p>
  <input type="password" id="lockPass" placeholder="Senha" aria-label="Senha" inputmode="numeric">
  <div id="lockErr"></div>
  <button class="primary" id="lockBtn">divar
  </button>
</form></div>

<script src="vendor/pdf-worker-data.js"></script>
<script src="vendor/pdf.js"></script>
<script src="vendor/pdf-lib.js"></script>
<script src="vendor/ocr-data.js"></script>
<script src="vendor/tesseract.js"></script>
<script src="app.js"></script>
</body>
</html>
